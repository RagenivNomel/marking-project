# Build the macOS app on GitHub's Apple Silicon runner: the same
# `pixi run build` as on a Mac, with the .dmg kept as a downloadable artifact.
# Runs for version tags (v1.2.3) or by hand from the Actions tab, not on every
# push: macOS runner minutes count ten times against a private repo's allowance.
name: Build macOS app

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          pixi-version: v0.81.0
          # A fresh install keeps each package's licence files for the notices.
          cache: false
      - run: pixi run build
      - uses: actions/upload-artifact@v7
        with:
          name: marking-app-mac
          path: dist/*.dmg
          retention-days: 14
